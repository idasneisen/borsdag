<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Børsdagspartay</title>

<style>
:root{
  --bg1:#5b2cff;
  --bg2:#001b3f;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
  color:white;
  background:radial-gradient(circle at top left,var(--bg1),var(--bg2));
  overflow:hidden;
}

.container{width:900px;max-width:100%;}

h1{
  font-size:60px;
  margin:0 0 20px 0;
  font-weight:900;
  letter-spacing:-1px;
}

.board{
  background:rgba(0,0,0,0.3);
  padding:20px;
  border-radius:25px;
  backdrop-filter:blur(10px);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  margin-bottom:12px;
  border-radius:18px;
  font-size:24px;
  font-weight:800;
  background:rgba(255,255,255,0.12);
  transition:transform 0.5s cubic-bezier(.2,.9,.2,1);
}

.row:last-child{margin-bottom:0;}

.top1{box-shadow:0 0 25px rgba(255,215,0,0.5);}
.top2{box-shadow:0 0 25px rgba(192,192,192,0.4);}
.top3{box-shadow:0 0 25px rgba(205,127,50,0.4);}

.left{display:flex;align-items:center;gap:15px;}
.rank{
  font-weight:900;
  background:rgba(255,255,255,0.2);
  padding:6px 14px;
  border-radius:12px;
}

.score{
  font-size:34px;
  font-weight:950;
}

.status{
  margin-top:15px;
  opacity:0.8;
  font-weight:600;
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.6);
}

.overlay.show{display:flex;}

.podium{
  background:#111;
  padding:40px;
  border-radius:30px;
  text-align:center;
}

.podium h2{margin-top:0;font-size:40px;}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">
<h1>Børsdagspartay</h1>
<div class="board" id="board"></div>
<div class="status" id="status">Laster...</div>
</div>

<div class="overlay" id="overlay">
  <div class="podium" id="podium"></div>
</div>

<script>

const SHEET_ID="1XmtpS4_F4vqQtcUWcUVOuEEdp9l6qrfKNDnHCD-oHSQ";
const GID="0";
const REFRESH_MS=4000;

const DATA_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

const board=document.getElementById("board");
const statusEl=document.getElementById("status");
const overlay=document.getElementById("overlay");
const podium=document.getElementById("podium");

let prevScores={};
let prevLeader=null;
let initialized=false;

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const delim=lines[0].includes(";")?";":",";
  const headers=lines[0].split(delim).map(h=>h.trim().toLowerCase());

  const lagIdx=headers.indexOf("lag");
  const poengIdx=headers.indexOf("poeng");
  const endIdx=headers.indexOf("avslutt");

  let ended=false;

  const data=lines.slice(1).map(l=>{
    const cols=l.split(delim);
    const name=(cols[lagIdx]||"").trim();
    const score=Number((cols[poengIdx]||"").replace(",","."));
    if(endIdx!==-1){
      const v=(cols[endIdx]||"").toLowerCase();
      if(v==="ja") ended=true;
    }
    return {name,score};
  }).filter(x=>x.name);

  return {data,ended};
}

function render(data){
  data.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"no"));
  board.innerHTML="";
  data.forEach((t,i)=>{
    const row=document.createElement("div");
    row.className="row";
    if(i===0)row.classList.add("top1");
    if(i===1)row.classList.add("top2");
    if(i===2)row.classList.add("top3");
    row.innerHTML=`
      <div class="left">
        <div class="rank">${i+1}</div>
        <div>${t.name}</div>
      </div>
      <div class="score">${t.score}</div>
    `;
    board.appendChild(row);
  });
}

function handleCelebration(data){
  const sorted=[...data].sort((a,b)=>b.score-a.score);
  const leaderNow=sorted[0]?.name;

  let increased=false;
  for(const t of sorted){
    if(prevScores[t.name]!==undefined && t.score>prevScores[t.name]){
      increased=true;
      break;
    }
  }

  prevScores=Object.fromEntries(sorted.map(t=>[t.name,t.score]));

  if(!initialized){
    initialized=true;
    prevLeader=leaderNow;
    return;
  }

  if(increased) startConfetti(2000);

  if(prevLeader && leaderNow && leaderNow!==prevLeader){
    startConfetti(4000);
  }

  prevLeader=leaderNow;
}

async function load(){
  const res=await fetch(DATA_URL+"?t="+Date.now());
  const csv=await res.text();
  const {data,ended}=parseCSV(csv);

  render(data);
  handleCelebration(data);

  statusEl.textContent="Oppdatert: "+new Date().toLocaleTimeString();

  if(ended){
    showPodium(data);
  }
}

function showPodium(data){
  const sorted=[...data].sort((a,b)=>b.score-a.score);
  const top3=sorted.slice(0,3);
  podium.innerHTML=`
    <h2>🏆 Pallen 🏆</h2>
    <p>🥇 ${top3[0]?.name} (${top3[0]?.score})</p>
    <p>🥈 ${top3[1]?.name} (${top3[1]?.score})</p>
    <p>🥉 ${top3[2]?.name} (${top3[2]?.score})</p>
  `;
  overlay.classList.add("show");
  startConfetti(5000);
}

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

function startConfetti(duration){
  const pieces=150;
  const confetti=Array.from({length:pieces},()=>({
    x:Math.random()*canvas.width,
    y:-20,
    r:5+Math.random()*6,
    vy:2+Math.random()*4,
    vx:-2+Math.random()*4,
    c:`hsl(${Math.random()*360},100%,60%)`
  }));

  const start=Date.now();

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      ctx.fillStyle=p.c;
      ctx.fillRect(p.x,p.y,p.r,p.r);
    });
    if(Date.now()-start<duration){
      requestAnimationFrame(draw);
    }else{
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  draw();
}

load();
setInterval(load,REFRESH_MS);

</script>
</body>
</html>
