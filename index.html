<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Børsdagspartay – Leaderboard</title>

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top left,#5b2cff,#001b3f);
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .container{ width:900px; max-width:100%; }
    h1{ font-size:48px; margin-bottom:20px; }

    .board{
      background:rgba(0,0,0,0.3);
      padding:20px;
      border-radius:20px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      margin-bottom:12px;
      border-radius:15px;
      font-size:22px;
      font-weight:600;
      transition:0.4s;
      background:rgba(255,255,255,0.08);
    }

    .top1{background:rgba(255,215,0,0.25);}
    .top2{background:rgba(192,192,192,0.25);}
    .top3{background:rgba(205,127,50,0.25);}

    .left{ display:flex; align-items:center; gap:18px; }
    .rank{ font-weight:900; min-width:28px; text-align:right; }
    .score{ font-size:26px; font-weight:900; }

    .status{ margin-top:15px; opacity:0.7; }

    .error{
      margin-top:15px;
      padding:15px;
      border-radius:10px;
      background:#ff2d2d33;
      display:none;
      white-space:pre-line;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Børsdagspartay</h1>
    <div class="board" id="board"></div>
    <div class="status" id="status">Laster...</div>
    <div class="error" id="error"></div>
  </div>

  <script>
    // ========= KONFIG =========
    const SHEET_ID = "1XmtpS4_F4vqQtcUWcUVOuEEdp9l6qrfKNDnHCD-oHSQ";
    const GID = "0";              // fanens gid (ofte 0 på første ark)
    const REFRESH_MS = 10000;     // 10 sek

    // CSV-export fra Google Sheets (stabilt)
    const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
    // ==========================

    const board = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      // Finn delimiter: semikolon eller komma
      const headerLine = lines[0];
      const delim = headerLine.includes(";") ? ";" : ",";

      const headers = headerLine.split(delim).map(h => h.trim().toLowerCase());
      const lagIdx = headers.indexOf("lag");
      const poengIdx = headers.indexOf("poeng");

      if (lagIdx === -1 || poengIdx === -1) {
        throw new Error("CSV må ha kolonnene 'Lag' og 'Poeng' i første rad.");
      }

      const rows = lines.slice(1).map(line => line.split(delim));

      return rows.map(cols => {
        const name = (cols[lagIdx] ?? "").trim();
        const scoreRaw = (cols[poengIdx] ?? "").trim().replace(",", "."); // hvis noen skriver 10,5
        const score = Number(scoreRaw) || 0;
        return { name, score };
      }).filter(r => r.name);
    }

    async function load() {
      errorEl.style.display = "none";
      statusEl.textContent = "Henter data…";

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 7000);

      try {
        const res = await fetch(DATA_URL + "&t=" + Date.now(), { signal: controller.signal });
        clearTimeout(timeout);

        if (!res.ok) throw new Error("Kunne ikke hente data (HTTP " + res.status + ")");

        const csv = await res.text();
        const data = parseCSV(csv).sort((a,b) => b.score - a.score);

        // VIKTIG: tøm før vi tegner (hindrer duplikater)
        board.innerHTML = "";

        data.forEach((team, index) => {
          const row = document.createElement("div");
          row.className = "row";
          if (index === 0) row.classList.add("top1");
          if (index === 1) row.classList.add("top2");
          if (index === 2) row.classList.add("top3");

          row.innerHTML = `
            <div class="left">
              <div class="rank">${index + 1}</div>
              <div>${team.name}</div>
            </div>
            <div class="score">${team.score}</div>
          `;

          board.appendChild(row);
        });

        statusEl.textContent = "Oppdateres automatisk";
      } catch (e) {
        clearTimeout(timeout);
        errorEl.style.display = "block";
        errorEl.textContent =
          "Feil ved lasting:\n\n" +
          (e?.name === "AbortError" ? "Timeout (7 sek). Sjekk nett/blokkering." : (e?.message || e)) +
          "\n\nSjekk:\n• At arket er delt: Alle med linken kan se\n• At rad 1 heter: Lag | Poeng\n• At du bruker riktig gid (fanen)";
        statusEl.textContent = "Kunne ikke oppdatere.";
        console.error(e);
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
